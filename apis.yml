aid: doodles
name: Doodles
description: 'Doodles is a Web3-native entertainment and media company built around the
  10,000-piece Doodles NFT collection launched on Ethereum in 2021 by artist Scott Martin
  (Burnt Toast) with Evan Keast and Jordan Castro. Doodles, LLC has since grown into a
  character-IP and animation business — it acquired the Emmy-nominated animation studio
  Golden Wolf, ships the Stoodio avatar app, the DOOD token, the Prism image model trained
  on Doodles-owned IP, and DreamNet, an onchain worldbuilding and storytelling layer.
  Doodles publishes no public REST API or developer portal; its machine-readable developer
  surface is limited to two first-party open-source npm libraries for the Flow blockchain
  (@doodlesteam/floo and @doodlesteam/flooks) and a signed outbound webhook integration
  contract published as a reference server on its GitHub organization.'
